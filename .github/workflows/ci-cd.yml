name: CI/CD Flask App

on:
  push:
    branches: ["main"]
  pull_request:
  # The deploy job only runs when you start the workflow by hand.
  workflow_dispatch:

# Least privilege: jobs can only read the repository unless they ask for more.
permissions:
  contents: read

env:
  REMOTE_PATH: /home/ubuntu/flask-app

jobs:
  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved by an attacker, a SHA cannot.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build -t flask-app:${{ github.sha }} .

      # v0.35.0 is the version Aqua lists as safe after the March 2026 tag hijack.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flask-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" # the build fails on a fixable HIGH or CRITICAL vulnerability

  deploy:
    name: Deploy to EC2 over SSH
    runs-on: ubuntu-latest
    needs: [codeql, trivy]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The server's host key is checked against a known value (no StrictHostKeyChecking=no).
      - name: Set up SSH key and known host
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy updated files to EC2
        run: |
          rsync -avz --exclude '.git' -e "ssh -i ~/.ssh/deploy_key" . "$EC2_USERNAME@$EC2_HOST:$REMOTE_PATH"

      - name: Restart Docker container on EC2
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USERNAME@$EC2_HOST" << 'EOF_SSH'
            set -e
            cd /home/ubuntu/flask-app
            docker-compose down
            docker-compose up --build -d
            docker system prune -f
          EOF_SSH
